services:

  broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: broker
    volumes:
      - ./broker.py:/app/main.py
    ports:
      - "5555:5555"
      - "5556:5556"

  pubsub-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: pubsub-proxy
    volumes:
      - ./pubsub_proxy.py:/app/main.py
    ports:
      - "5557:5557"
      - "5558:5558"

  reference:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: reference
    volumes:
      - ./reference.py:/app/main.py
    ports:
      - "5559:5559"

  servidor-py-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: servidor-py-1
    volumes:
      - ./servidor.py:/app/main.py
      - servidor_py_1_data:/app
    environment:
      - SERVER_NAME=servidor-py-1
      - PEER_HOST=servidor-py-1
      - PEER_PORT=6000
    depends_on:
      - broker
      - pubsub-proxy
      - reference

  servidor-py-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: servidor-py-2
    volumes:
      - ./servidor.py:/app/main.py
      - servidor_py_2_data:/app
    environment:
      - SERVER_NAME=servidor-py-2
      - PEER_HOST=servidor-py-2
      - PEER_PORT=6002
    depends_on:
      - broker
      - pubsub-proxy
      - reference

  servidor-java-1:
    build:
      context: ./java
      dockerfile: Dockerfile
    image: cc7261:java
    container_name: servidor-java-1
    environment:
      - APP_MODE=servidor
      - SERVER_NAME=servidor-java-1
      - PEER_HOST=servidor-java-1
      - PEER_PORT=6001
    volumes:
      - servidor_java_1_data:/data
    depends_on:
      - broker
      - pubsub-proxy
      - reference

  servidor-java-2:
    build:
      context: ./java
      dockerfile: Dockerfile
    image: cc7261:java
    container_name: servidor-java-2
    environment:
      - APP_MODE=servidor
      - SERVER_NAME=servidor-java-2
      - PEER_HOST=servidor-java-2
      - PEER_PORT=6003
    volumes:
      - servidor_java_2_data:/data
    depends_on:
      - broker
      - pubsub-proxy
      - reference

  cliente-py-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: cliente-py-1
    volumes:
      - ./cliente.py:/app/main.py
    environment:
      - USERNAME=bot_py_01
    depends_on:
      - broker
      - pubsub-proxy
      - servidor-py-1
      - servidor-py-2
      - servidor-java-1
      - servidor-java-2

  cliente-py-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: cliente-py-2
    volumes:
      - ./cliente.py:/app/main.py
    environment:
      - USERNAME=bot_py_02
    depends_on:
      - broker
      - pubsub-proxy
      - servidor-py-1
      - servidor-py-2
      - servidor-java-1
      - servidor-java-2

  cliente-java-1:
    build:
      context: ./java
      dockerfile: Dockerfile
    image: cc7261:java
    container_name: cliente-java-1
    environment:
      - APP_MODE=cliente
      - USERNAME=bot_java_01
    depends_on:
      - broker
      - pubsub-proxy
      - servidor-py-1
      - servidor-py-2
      - servidor-java-1
      - servidor-java-2

  cliente-java-2:
    build:
      context: ./java
      dockerfile: Dockerfile
    image: cc7261:java
    container_name: cliente-java-2
    environment:
      - APP_MODE=cliente
      - USERNAME=bot_java_02
    depends_on:
      - broker
      - pubsub-proxy
      - servidor-py-1
      - servidor-py-2
      - servidor-java-1
      - servidor-java-2

volumes:
  servidor_py_1_data:
  servidor_py_2_data:
  servidor_java_1_data:
  servidor_java_2_data: